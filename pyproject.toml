[project]
name = "the_pigeon_holes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "datasets>=4.0.0",
    "lean-interact>=0.11.5",
    "modal>=1.6.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["the_pigeon_holes*", "problems", "problems.*"]
namespaces = false

[tool.setuptools.package-data]
problems = ["*/problem.txt", "*/instances.json", "subset_sum/*.json", "subset_sum/*.lean"]
the_pigeon_holes = ["fitness/lean/*.lean"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "modal>=1.0,<2", "httpx>=0.28"]
