[project]
name = "the_pigeon_holes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "datasets>=4.0.0",
    "lean-interact>=0.11.5",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
